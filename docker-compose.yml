services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bamadogym:latest
    container_name: bamado-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
      CACHE_CONFIG: ${CACHE_CONFIG:-true}
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bamado

  postgres:
    image: postgres:16-alpine
    container_name: bamado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bamadogym}
      POSTGRES_USER: ${DB_USERNAME:-bamado}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bamado

networks:
  bamado:
    driver: bridge

volumes:
  postgres_data:
  storage_app:
  storage_logs:
