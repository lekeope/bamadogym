services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: bamadogym-app:latest
    container_name: bamado-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
      CACHE_CONFIG: ${CACHE_CONFIG:-true}
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bamado

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: bamadogym-web:latest
    container_name: bamado-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage_app:/var/www/html/storage/app:ro
    depends_on:
      - app
    networks:
      - bamado

  postgres:
    image: postgres:16-alpine
    container_name: bamado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bamadogym}
      POSTGRES_USER: ${DB_USERNAME:-bamado}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bamado

  queue:
    image: bamadogym-app:latest
    container_name: bamado-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      CACHE_CONFIG: "true"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - bamado

  scheduler:
    image: bamadogym-app:latest
    container_name: bamado-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      CACHE_CONFIG: "true"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - bamado

networks:
  bamado:
    driver: bridge

volumes:
  postgres_data:
  storage_app:
  storage_logs:
